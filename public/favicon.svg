<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" />

  <!-- Cash Register Body / Base -->
  <g filter="url(#shadow)">
    <!-- Main POS Base -->
    <path d="M 28 88 L 100 88 L 94 98 L 34 98 Z" fill="#94a3b8" />
    <rect x="26" y="96" width="76" height="6" rx="2" fill="#64748b" />
    
    <!-- Screen / Register Body -->
    <rect x="36" y="52" width="56" height="34" rx="5" fill="#ffffff" />
    <rect x="40" y="56" width="48" height="18" rx="3" fill="#0f172a" />
    
    <!-- Screen Content: Green glow numbers -->
    <rect x="44" y="60" width="16" height="3" rx="1" fill="#22c55e" />
    <rect x="44" y="66" width="28" height="4" rx="1" fill="#38bdf8" />
    <rect x="76" y="64" width="8" height="6" rx="1" fill="#22c55e" />

    <!-- Keyboard buttons -->
    <circle cx="45" cy="79" r="2" fill="#3b82f6" />
    <circle cx="53" cy="79" r="2" fill="#3b82f6" />
    <circle cx="61" cy="79" r="2" fill="#3b82f6" />
    <circle cx="69" cy="79" r="2" fill="#3b82f6" />
    <circle cx="77" cy="79" r="2" fill="#10b981" />

    <!-- Receipt / Paper popping up -->
    <path d="M 66 52 L 66 38 L 71 40 L 76 38 L 81 40 L 86 38 L 86 52 Z" fill="#f8fafc" />
    <line x1="70" y1="43" x2="82" y2="43" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="70" y1="47" x2="78" y2="47" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Pencil / Stationery crossing dynamically across -->
    <g transform="translate(62, 14) rotate(42)">
      <!-- Pencil Body -->
      <polygon points="0,0 12,0 12,50 0,50" fill="#f59e0b" />
      <polygon points="0,0 4,0 4,50 0,50" fill="#d97706" />
      <!-- Eraser -->
      <rect x="0" y="50" width="12" height="10" rx="2" fill="#f43f5e" />
      <rect x="0" y="47" width="12" height="4" fill="#cbd5e1" />
      <!-- Pencil Wood & Tip -->
      <polygon points="0,0 12,0 6,-12" fill="#fed7aa" />
      <polygon points="4,-8 8,-8 6,-12" fill="#1e293b" />
    </g>
  </g>
</svg>

